[package]
name = "yew-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yew-client"
path = "src/main.rs"

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-events = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "Window", "Location"] }
