version: "3.8"

services:
  # ================== PostgreSQL ==================
  db:
    image: postgres:17-alpine
    container_name: axum-bank-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ================== Axum Backend ==================
  backend:
    build:
      context: ./Axum-Bank
      dockerfile: Dockerfile.dev
    container_name: axum-bank-backend
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: ${RUST_LOG}
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
    depends_on:
      db:
        condition: service_healthy
    # Hot-reload con cargo-watch
    command: ["cargo", "watch", "-x", "run"]

  # ================== Yew Frontend ==================
  frontend:
    build:
      context: ./Yew-Client
      dockerfile: Dockerfile
    container_name: axum-bank-frontend
    ports:
      - "${TRUNK_SERVE_PORT}:8080"
    volumes:
      - ./frontend:/app
      - trunk_cache:/root/.cache/trunk
    depends_on:
      - backend

volumes:
  postgres_data:
  cargo_cache:
  trunk_cache:
