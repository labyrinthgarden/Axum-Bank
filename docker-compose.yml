services:
  db:
    image: postgres:17-alpine
    container_name: axum-bank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank_password}
      POSTGRES_DB: ${POSTGRES_DB:-bank_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank_user} -d ${POSTGRES_DB:-bank_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Axum-Bank
      dockerfile: Dockerfile
    container_name: axum-bank-backend
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bank_user}:${POSTGRES_PASSWORD:-bank_password}@db:5432/${POSTGRES_DB:-bank_db}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./Yew-Client
      dockerfile: Dockerfile
    container_name: axum-bank-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
